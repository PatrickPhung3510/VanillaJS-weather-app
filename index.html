<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherNow</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <!-- Search bar-->
    <h1 class="welcome-note">Welcome to WeatherNow!</h1>
    <div class="search-bar">
      <input class="js-search-bar" type="text" placeholder="Search...">
      <button class="search-btn js-search-btn" title="Search">🔍︎</button>
    </div>
    <p class="search-error js-search-error hidden"></p>
  </header>
  <main>
  <section id="dashboard-view">
    <h2 class="city-title">Saved cities</h2>
    <div class="js-city-cards"></div>
  </section>
  <!-- Detail city informatioon -->
  <section id="detail-view" class="hidden">
    <div class="detail-actions">
      <button class="back-btn js-back-btn" title="Back to Dashboard">←</button>
      <button class="save-btn js-save-btn">☆</button>
    </div>
    <!-- Current weather and conditions -->
    <div class="detail-header">
      <h2 class="detail-city-name js-detail-city-name"></h2>
      <p class="detail-city-temp js-detail-city-temp"></p>
      <p class="detail-city-conditions js-detail-city-conditions"></p>
      <p class="detail-city-highlow js-detail-city-highlow"></p>
    </div>
    
    <!-- Forecast row -->
    <div class="forecast-row js-forecast-row"></div>

    <!-- Stats grid -->
    <div class="stats-grid">
      <div class="feels-like">
        <p class="feels-like-label">Feels Like</p>
        <p class="feels-like-temp js-feels-like-temp"></p>
      </div>
      <div class="wind">
        <p class="wind-label">Wind</p>
        <p class="wind-stat js-wind-stat"></p>
      </div>
      <div class="precipitation">
        <p class="precipitation-label">Precipitation</p>
        <p class="precipitation-stat js-precipitation-stat"></p>
      </div>
      <div class="air-quality">
        <p class="air-quality-label">Air Quality</p>
        <p class="air-quality-state js-air-quality-state"></p>
      </div>
    </div>
  </section>
  </main>
</body>
<script src="weather.js"></script>
</html>
