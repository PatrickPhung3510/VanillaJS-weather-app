<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherNow</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <!-- Search bar-->
    <h1 class="welcome-note">Welcome to WeatherNow!</h1>
    <div class="search-bar">
      <input type="text" placeholder="Search...">
      <button class="search-btn" title="Search">🔍︎</button>
    </div>
  </header>
  <section id="dashboard-view">
    <h2 class="city-title">Saved cites</h2>
    <div class="city-card">
      <h2 class="city-name">London</h2>
      <p class="city-condition">Conditions</p>
      <p class="city-temp">64°</p>
    </div>
  </section>
</body>

</html>
