<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherNow</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <!-- Search bar-->
    <h1 class="welcome-note">Welcome to WeatherNow!</h1>
    <div class="search-bar">
      <input class="js-search-bar" type="text" placeholder="Search...">
      <button class="search-btn js-search-btn" title="Search">🔍︎</button>
    </div>
  </header>
  <main>
    <section id="dashboard-view">
    <h2 class="city-title">Saved cites</h2>
    <div class="city-card">
      <h2 class="city-name">London</h2>
      <p class="city-condition">Conditions</p>
      <p class="city-temp">64°</p>
    </div>
  </section>
  <!-- Detail city informatioon -->
  <section id="detail-view" class="hidden">
    <button class="back-btn">←</button>
    
    <!-- Current weather and conditions -->
    <div class="detail-header">
      <h2 class="detail-city-name">London</h2>
      <p class="detail-city-temp">69°</p>
      <p class="detail-city-conditons">Cloudy</p>
      <p class="detail-city-highlow">H:77° L:64°</p>
    </div>
    
    <!-- Forecast row -->
    <div class="forecast-row">
      <div class="forecast-day">
         <p class="forecast-day-name">Mon</p>
        <img class="forecast-weather-img" src="" alt="">
        <p class="forecast-temp">64°</p>
      </div>
    </div>

    <!-- Stats grid -->
    <div class="stats-grid">
      <div class="feels-like">
        <p class="feels-like-label">Feels Like</p>
        <p class="feels-like-temp">62°</p>
      </div>
      <div class="wind">
        <p class="wind-label">Wind</p>
        <p class="wind-stat">1 mph</p>
      </div>
      <div class="precipitation">
        <p class="precipitation-label">Precipitation</p>
        <p class="precipitation-stat">0" Today</p>
      </div>
      <div class="air-quality">
        <p class="air-quality-label">Air Quality</p>
        <p class="air-quality-state">56 Moderate</p>
      </div>
    </div>
  </section>
  </main>
</body>
<script src="weather.js"></script>
</html>
